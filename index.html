<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waqofps - FPS Analiz Merkezi</title>
    <!-- İkonlar ve Fontlar için Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b, #090d16);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 20px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(56, 189, 248, 0.2);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(56, 189, 248, 0.1);
            border-radius: 20px;
            width: 100%;
            max-width: 550px;
            padding: 35px;
            transform: translateY(0);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .container:hover {
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(56, 189, 248, 0.25);
            border-color: rgba(56, 189, 248, 0.5);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 26px;
            letter-spacing: 1.5px;
            background: linear-gradient(90deg, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            font-weight: 800;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: color 0.3s ease;
        }

        .form-group:hover label {
            color: #38bdf8;
        }

        label i {
            color: #38bdf8;
            font-size: 14px;
            transition: transform 0.3s ease;
        }

        .form-group:hover label i {
            transform: scale(1.2);
        }

        select {
            width: 100%;
            padding: 12px 15px;
            background: rgba(30, 41, 59, 0.7);
            border: 2px solid rgba(51, 65, 85, 0.6);
            border-radius: 10px;
            color: #f1f5f9;
            font-size: 14px;
            outline: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        select:hover {
            border-color: rgba(56, 189, 248, 0.5);
            background: rgba(30, 41, 59, 0.9);
        }

        select:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3), inset 0 2px 4px rgba(0,0,0,0.2);
            background: rgba(15, 23, 42, 0.95);
        }

        /* Oyun Seçimi İçin Özel Görsel Alan */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 5px;
        }

        .game-card {
            background: rgba(30, 41, 59, 0.6);
            border: 2px solid rgba(51, 65, 85, 0.6);
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .game-card img {
            width: 100%;
            height: 65px;
            object-fit: cover;
            border-radius: 6px;
            transition: transform 0.3s ease;
        }

        .game-card span {
            font-size: 12px;
            font-weight: 600;
            color: #cbd5e1;
        }

        .game-card:hover {
            border-color: #38bdf8;
            transform: translateY(-4px);
            background: rgba(56, 189, 248, 0.1);
            box-shadow: 0 8px 20px rgba(56, 189, 248, 0.2);
        }

        .game-card:hover img {
            transform: scale(1.05);
        }

        .game-card.selected {
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.2);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }

        .btn-test {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 25px;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .btn-test::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: rgba(255, 255, 255, 0.15);
            transform: rotate(45deg) translate(-100%, 0);
            transition: transform 0.6s ease;
        }

        .btn-test:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(56, 189, 248, 0.6);
            background: linear-gradient(135deg, #0369a1, #0ea5e9);
        }

        .btn-test:hover::after {
            transform: rotate(45deg) translate(100%, 0);
        }

        .btn-test:active {
            transform: translateY(1px);
        }

        .result-box {
            margin-top: 25px;
            background: rgba(15, 23, 42, 0.7);
            border: 2px solid rgba(56, 189, 248, 0.3);
            border-radius: 14px;
            padding: 20px;
            text-align: center;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.4);
            transition: all 0.3s ease;
        }

        .result-box:hover {
            border-color: rgba(56, 189, 248, 0.6);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.2), inset 0 4px 10px rgba(0,0,0,0.4);
        }

        .result-score {
            font-size: 38px;
            font-weight: 800;
            background: linear-gradient(90deg, #4ade80, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
            text-shadow: 0 0 30px rgba(74, 222, 128, 0.2);
        }

        .result-label {
            font-size: 12px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>FPS Analiz Merkezi</h1>

        <div class="form-group">
            <label for="gpu"><i class="fa-solid fa-microchip"></i> Ekran Kartı (GPU)</label>
            <select id="gpu">
                <option value="rtx5090">NVIDIA RTX 5090 (Masaüstü)</option>
                <option value="rtx4060">NVIDIA RTX 4060 (Laptop)</option>
                <option value="rtx3060">NVIDIA RTX 3060</option>
            </select>
        </div>

        <div class="form-group">
            <label for="cpu"><i class="fa-solid fa-cpu"></i> İşlemci (CPU)</label>
            <select id="cpu">
                <option value="i7-13650hx">Intel Core i7-13650HX</option>
                <option value="i5-13500h">Intel Core i5-13500H</option>
                <option value="ryzen7">AMD Ryzen 7 7840HS</option>
            </select>
        </div>

        <div class="form-group">
            <label for="ram"><i class="fa-solid fa-memory"></i> RAM (Bellek)</label>
            <select id="ram">
                <option value="32gb">32 GB DDR5 RAM</option>
                <option value="16gb">16 GB DDR5 RAM</option>
                <option value="8gb">8 GB DDR4 RAM</option>
            </select>
        </div>

        <div class="form-group">
            <label for="resolution"><i class="fa-solid fa-display"></i> Ekran Çözünürlüğü (Görüntü Kalitesi)</label>
            <select id="resolution">
                <option value="1920x1080">1920x1080 (FHD)</option>
                <option value="2560x1440">2560x1440 (2K QHD)</option>
                <option value="800x600">800x600 (SVGA)</option>
            </select>
        </div>

        <div class="form-group">
            <label><i class="fa-solid fa-gamepad"></i> Oyun ve Ayar Seçimi</label>
            <div class="game-grid">
                <div class="game-card selected" onclick="selectGame(this)">
                    <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?w=300&auto=format&fit=crop&q=80" alt="Valorant">
                    <span>Valorant (Düşük)</span>
                </div>
                <div class="game-card" onclick="selectGame(this)">
                    <img src="https://images.unsplash.com/photo-1538481199705-c710c4e965fc?w=300&auto=format&fit.crop&q=80" alt="CS2">
                    <span>Counter-Strike 2</span>
                </div>
            </div>
        </div>

        <button class="btn-test">Performans Test Et</button>

        <div class="result-box">
            <div class="result-score">0 - 0</div>
            <div class="result-label">Tahmini FPS Aralığı</div>
        </div>
    </div>

    <script>
        function selectGame(element) {
            document.querySelectorAll('.game-card').forEach(card => card.classList.remove('selected'));
            element.classList.add('selected');
        }
    </script>
</body>
</html>
